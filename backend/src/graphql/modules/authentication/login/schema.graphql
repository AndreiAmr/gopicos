input ILoginInput {
  email: String!
  password: String!
}

type TokenData {
  token: String
  exp: Int
  createdAt: Int
  name: String
  email: String
  id: String
  # true só quando o login reativou uma conta desativada (D14)
  reactivated: Boolean
}

extend type Mutation {
  login(props: ILoginInput): TokenData
}
