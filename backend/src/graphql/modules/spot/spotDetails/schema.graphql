type SpotAuthor {
  id: String
  name: String
  firstName: String
  lastName: String
}

type SpotDetails {
  id: String
  name: String
  description: String
  modality: String
  isPaid: Boolean
  alwaysOpen: Boolean
  hasCoverage: Boolean
  images: [String]
  equipmentRequired: Boolean
  entryAmount: String
  coordinates: JSON
  openingHours: String
  markingType: String
  author: SpotAuthor
  ratingAverage: Float
  reviewsCount: Int
  isOwner: Boolean
}

extend type Query {
  getSpotById(id: String!): SpotDetails @Authenticated
}
