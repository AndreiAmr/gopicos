type Spot {
  id: String
  name: String
  description: String
  modality: String
  isPaid: Boolean
  alwaysOpen: Boolean
  hasCoverage: Boolean
  images: [Upload!]
  equipmentRequired: Boolean
  entryAmount: String
  coordinates: JSON
  markingType: String
}

extend type Query {
  getAllSpots: [Spot] @Authenticated
}
