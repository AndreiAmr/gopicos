type Spot {
  id: String
  name: String
  description: String
  modality: String
  isPaid: Boolean
  alwaysOpen: Boolean
  hasCoverage: Boolean
  images: [Upload!]
  equipmentRequired: Boolean
  entryAmount: String
  coordinates: JSON
  markingType: String
  openingHours: String
  ratingAverage: Float
  reviewsCount: Int
}

input SpotsFilter {
  modality: String
  isPaid: Boolean
  hasCoverage: Boolean
  minRating: Int
}

extend type Query {
  getAllSpots(filter: SpotsFilter): [Spot] @Authenticated
}
