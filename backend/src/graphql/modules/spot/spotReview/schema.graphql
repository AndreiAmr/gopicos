input SpotReview {
  spotId: String!
  "Inteiro de 1 a 5. Declarado Float para o service devolver VALIDATION_ERROR em pt-BR a valores como 4.5."
  rating: Float!
  description: String
}

type SpotReviewReturn {
  rating: Int
  description: String
}

extend type Mutation {
  createSpotReview(data: SpotReview!): SpotReviewReturn @Authenticated
}
