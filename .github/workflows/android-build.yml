name: Gerar APK na Pull Request (Mobile)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main # ou master
    # 🎯 CONFIGURAÇÃO 1: Só dispara o build se houver alterações na pasta do mobile
    paths:
      - 'mobile/**' # Altere aqui se o nome da sua pasta mobile for diferente (ex: "gopicos/mobile/**")

jobs:
  build-android:
    name: Build do APK Android
    runs-on: ubuntu-latest

    # 🎯 CONFIGURAÇÃO 2: Define que todos os comandos "run" abaixo rodam por padrão dentro da pasta mobile
    defaults:
      run:
        working-directory: ./mobile # Altere se a pasta tiver outro nome

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './mobile/package-lock.json' # Aponta para o cache de pacotes correto

      - name: Instalar dependências
        run: npm install # Executado automaticamente dentro de ./mobile

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew # Executado em ./mobile/android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Enviar APK para os Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk # Aponta para o caminho final do APK gerado
          retention-days: 7
