name: Gerar APK na Pull Request (Mobile)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main # ou master
    # 🎯 CONFIGURAÇÃO 1: Só dispara o build se houver alterações na pasta do mobile
    paths:
      - 'mobile/**' # Altere aqui se o nome da sua pasta mobile for diferente (ex: "gopicos/mobile/**")

jobs:
  build-android:
    name: Build do APK Android
    runs-on: ubuntu-latest

    # 🎯 CONFIGURAÇÃO 2: Define que todos os comandos "run" abaixo rodam por padrão dentro da pasta mobile
    defaults:
      run:
        working-directory: ./mobile # Altere se a pasta tiver outro nome

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Habilitar Corepack (Suporte ao Yarn v4)
        run: corepack enable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'
          cache-dependency-path: './mobile/yarn.lock' # Aponta para o cache de pacotes correto

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew # Executado em ./mobile/android/gradlew

      - name: Compilar Release APK 
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Enviar APK para os Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk # Aponta para o caminho final do APK gerado
          retention-days: 7
      - name: Criar Release de Teste no GitHub
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          tag_name: pr-build-${{ github.event.pull_request.number }}
          name: "Build de Teste - PR #${{ github.event.pull_request.number }}"
          body: "APK gerado automaticamente para testes na PR #${{ github.event.pull_request.number }}."
          draft: false
          prerelease: true # Fica marcado como versão de teste
          files: mobile/android/app/build/outputs/apk/release/app-release.apk # Anexa o APK aqui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Envia o link DIRETO do arquivo para o Discord
      - name: Notificar no Discord com Link Direto
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MOBILE || secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ **APK da PR #${{ github.event.pull_request.number }} disponível**

            📲 Baixar: ${{ github.server_url }}/${{ github.repository }}/releases/download/pr-build-${{ github.event.pull_request.number }}/app-release.apk
            🔗 PR: ${{ github.event.pull_request.html_url }}

            🌿 Branch: `${{ github.head_ref }}`
            👤 Autor: `${{ github.event.pull_request.user.login }}`
            📝 ${{ github.event.pull_request.title }}

      - name: Notificar ERRO no Discord
        if: failure()
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MOBILE || secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **Falha no build do APK da PR #${{ github.event.pull_request.number }}**

            🌿 Branch: `${{ github.head_ref }}`
            👤 Autor: `${{ github.event.pull_request.user.login }}`
            📝 ${{ github.event.pull_request.title }}

            🔍 Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
