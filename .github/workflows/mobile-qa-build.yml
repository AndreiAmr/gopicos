name: Gerar APK (QA Mobile)

on:
  push:
    branches:
      - development
    paths:
      - 'mobile/**' 
permissions:
  contents: write  
  checks: read


jobs:
  build-android-qa:
    name: Build do APK Android (QA)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aguardar Deploy do Backend
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }} # Consulta as checagens do exato commit atual
          check-name: 'deploy' # 👈 Nome exato do job de deploy (no arquivo do backend é "deploy")
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15 # Verifica o status a cada 15 segundos
          allowed-conclusions: success # Só prossegue se o deploy terminar com sucesso

      - name: Habilitar Corepack
        run: corepack enable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'
          cache-dependency-path: './mobile/yarn.lock'

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      # 🎯 INJEÇÃO DA URL DO RENDER NO .ENV
      # Você pode chumbar a URL aqui ou usar uma Secret do GitHub (recomendado)
      - name: Configurar Variáveis de Ambiente de QA
        run: |
          echo "API_URL=${{ secrets.API_QA_URL }}" > .env
          echo "Arquivo .env gerado com sucesso!"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew

      - name: Compilar Release APK 
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Enviar APK para os Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-qa-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      # Cria uma release específica de QA atrelada ao SHA do commit
      - name: Criar Release de QA no GitHub
        uses: softprops/action-gh-release@v2
        id: create_qa_release
        with:
          tag_name: qa-build-${{ github.sha }}
          name: "Build de QA (Mobile) - Commit ${{ github.sha }}"
          body: "APK gerado automaticamente apontando para o backend do Render."
          draft: false
          prerelease: true
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar no Discord com Link Direto
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ **Novo APK de QA Disponível!** 
            A branch \`development\` foi atualizada com sucesso.
            📲 **Baixar APK:** https://github.com/${{ github.repository }}/releases/download/qa-build-${{ github.sha }}/app-release.apk

      - name: Notificar ERRO no Discord
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **Deu ruim no Build de QA do Mobile!**
            A compilação da branch \`development\` falhou.
            🔍 **Logs:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
