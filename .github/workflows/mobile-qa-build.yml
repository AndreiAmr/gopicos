name: Gerar APK (QA Mobile)

on:
  push:
    branches:
      - development
    paths:
      - 'mobile/**'
      - 'backend/**'
      - '.github/workflows/mobile-qa-build.yml'
  workflow_dispatch:
permissions:
  contents: write  
  checks: read


jobs:
  build-android-qa:
    name: Build do APK Android (QA)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O workflow do backend só roda quando o push altera backend/**.
      # Só esperamos o check 'deploy' nesse caso (senão ele nunca existiria).
      - name: Verificar mudanças no backend
        id: backend_changes
        working-directory: .
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -qE '^0+$' || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Sem base de comparação confiável: espera o deploy por segurança
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^backend/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aguardar Deploy do Backend
        id: wait_backend_deploy
        if: steps.backend_changes.outputs.changed == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }} # Consulta as checagens do exato commit atual
          check-name: 'deploy' # 👈 Nome exato do job de deploy (no arquivo do backend é "deploy")
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15 # Verifica o status a cada 15 segundos
          allowed-conclusions: success # Só prossegue se o deploy terminar com sucesso

      - name: Habilitar Corepack
        run: corepack enable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'
          cache-dependency-path: './mobile/yarn.lock'

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      # 🎯 INJEÇÃO DA URL DO BACKEND DE QA NO .ENV
      # Usa a secret API_QA_URL para o APK apontar para o backend de QA.
      - name: Configurar Variáveis de Ambiente de QA
        run: |
          echo "API_URL=${{ secrets.API_QA_URL }}" > .env
          echo "Arquivo .env gerado com sucesso!"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew

      - name: Compilar Release APK 
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Enviar APK para os Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-qa-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      # Cria uma release específica de QA atrelada ao SHA do commit
      - name: Criar Release de QA no GitHub
        uses: softprops/action-gh-release@v2
        id: create_qa_release
        with:
          tag_name: qa-build-${{ github.sha }}
          name: "Build de QA (Mobile) - Commit ${{ github.sha }}"
          body: "APK gerado automaticamente apontando para o backend de QA."
          draft: false
          prerelease: true
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar no Discord com Link Direto
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MOBILE || secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ **APK de QA disponível**

            📲 Baixar: ${{ github.server_url }}/${{ github.repository }}/releases/download/qa-build-${{ github.sha }}/app-release.apk

            🌿 Branch: `${{ github.ref_name }}`
            👤 Autor: `${{ github.actor }}`
            📝 Commit: `${{ github.event.head_commit.message }}`

      # Falha do backend não deve alarmar o canal do mobile — o canal
      # qa-backend já notifica a causa. Aqui só informamos que o APK não foi
      # gerado, para ninguém procurar um bug de mobile que não existe.
      - name: Notificar build bloqueado pelo backend
        if: failure() && steps.wait_backend_deploy.outcome == 'failure'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MOBILE || secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ⚠️ **APK de QA não foi gerado**

            O deploy do backend falhou, então este build foi interrompido antes de compilar.
            A causa está sendo tratada no canal **qa-backend**.

            🔍 Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notificar ERRO no Discord
        if: failure() && steps.wait_backend_deploy.outcome != 'failure'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MOBILE || secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **Falha no build do APK de QA**

            🌿 Branch: `${{ github.ref_name }}`
            👤 Autor: `${{ github.actor }}`
            📝 Commit: `${{ github.event.head_commit.message }}`

            🔍 Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
