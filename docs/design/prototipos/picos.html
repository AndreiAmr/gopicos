<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoPicos - Protótipo estático de Picos (DS v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* Tokens do DS v2.0 (docs/design/design-system.md). Protótipo estático, sem código de produção. */
.light{--bg:#F0F3F5;--surface:#fff;--sunken:#E3E8EC;--text:#18181B;--muted:#565757;--subtle:#5C646A;--border:#7D858C;--divider:#D5DBE0;--primary:#F97316;--onp:#18181B;--soft:#FFEDD5;--ptext:#A84300;--star:#C77700;--error:#B3201F;--onerr:#fff;--info:#1D4ED8;--map:#E4EBE1;--road:#fff;--park:#CFE3C8}
.dark{--bg:#0F1113;--surface:#181B1F;--sunken:#0A0B0D;--text:#F5F6F7;--muted:#B2B8BE;--subtle:#9AA1A8;--border:#838B93;--divider:#2C3138;--primary:#FB923C;--onp:#1A0B02;--soft:#3A2008;--ptext:#FDBA74;--star:#FBBF24;--error:#FF8A80;--onerr:#0F1113;--info:#7FA8FF;--map:#1B2229;--road:#2A323B;--park:#1F2E25}
*{box-sizing:border-box}body{margin:0;background:#cfd4d8;font:16px/24px Inter,system-ui,sans-serif;color:#18181B;padding:24px}
h1{font:28px 'Permanent Marker';margin:0 0 4px}h2{font:600 18px Inter;margin:36px 0 12px}p.n{margin:0 0 12px;color:#333;font-size:14px}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.fr{position:relative;overflow:hidden;background:var(--bg);color:var(--text);border-radius:0;flex:none}
.m{width:393px;height:852px}.w{width:1280px;height:800px}.tall{height:1180px}
.cap{font:500 12px Inter;color:#444;margin:6px 0 0}
.abs{position:absolute}.col{display:flex;flex-direction:column}.r{display:flex;align-items:center}
.map{position:absolute;inset:0;background:var(--map)}.map i{position:absolute;background:var(--road);display:block}
.map .pk{background:var(--park);border-radius:50%}
svg.pl{position:absolute;inset:0;width:100%;height:100%}
.sh{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.card{background:var(--surface);border-radius:12px;padding:16px}
.btn{height:48px;border-radius:6px;background:var(--primary);color:var(--onp);font:600 16px Inter;display:flex;align-items:center;justify-content:center;width:100%;border:0}
.btn.g{background:none;border:1.5px solid var(--border);color:var(--text)}.btn.d{background:none;border:1.5px solid var(--error);color:var(--error)}.btn.x{background:var(--error);color:var(--onerr)}.btn.dis{background:var(--divider);color:var(--subtle)}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 12px;border:1.5px solid var(--border);border-radius:4px;background:var(--surface);font:600 14px Inter;white-space:nowrap}
.chip.on{background:#FACC15;border-color:#18181B;color:#18181B;box-shadow:2px 2px 0 #18181B}.chip.s{height:28px}
.in{height:48px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);padding:0 14px;display:flex;align-items:center;width:100%}
.in.e{border-color:var(--error)}.in.ta{height:96px;align-items:flex-start;padding-top:12px}
label{font:500 14px/20px Inter;color:var(--muted);display:block;margin-bottom:6px}
.err{color:var(--error);font:14px/20px Inter;margin-top:6px}.help{color:var(--muted);font:14px/20px Inter;margin-top:6px}
.ph{color:var(--subtle)}.mu{color:var(--muted);font-size:14px;line-height:20px}.st{color:var(--star)}.stg{color:var(--divider)}
.title{font:28px/32px 'Permanent Marker'}.spray{display:block;height:9px;width:190px;background:var(--primary);border-radius:99px;margin-top:2px;transform:rotate(-1.5deg)}
.photo{background:var(--sunken);color:var(--subtle);display:flex;align-items:center;justify-content:center;font:500 14px Inter}
.pin{position:absolute;height:26px;padding:0 8px;border-radius:99px;background:var(--surface);border:1.5px solid var(--border);font:600 12px Inter;display:flex;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin.on{background:var(--primary);color:var(--onp);border-color:#18181B;height:30px}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--surface);border-top:1px solid var(--divider);display:flex;justify-content:space-around;padding:8px 40px 24px;font:600 12px Inter;color:var(--muted)}
.tab div{display:flex;flex-direction:column;align-items:center;gap:2px}.tab b{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted)}.tab .a{color:var(--ptext)}.tab .a b{background:var(--primary);border-color:var(--primary)}
.fab{position:absolute;width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--onp);font:500 32px Inter;display:flex;align-items:center;justify-content:center}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px 28px}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--divider);margin:0 auto 14px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.hdr{position:absolute;left:0;right:0;top:0;height:64px;background:var(--surface);border-bottom:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.logo{font:28px 'Permanent Marker';color:var(--primary)}.dark .logo{color:var(--primary)}
.back{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px}
.gap{gap:12px}.g8{gap:8px}.g16{gap:16px}.sk{background:var(--sunken);border-radius:6px}
.row2{display:flex;justify-content:space-between;height:44px;align-items:center;border-bottom:1px solid var(--divider);font-size:14px}.row2:last-child{border:0}.row2 b{font-weight:600}
.seg{display:flex;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;height:44px}.seg div{flex:1;display:flex;align-items:center;justify-content:center;font:600 14px Inter}.seg .on{background:var(--primary);color:var(--onp)}
.sw{width:48px;height:28px;border-radius:99px;background:var(--divider);position:relative}.sw.on{background:var(--primary)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}.sw.on:after{left:23px}
.cb{width:24px;height:24px;border:2px solid var(--border);border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}.cb.on{background:var(--primary);border-color:var(--primary);color:var(--onp)}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph3 .photo{height:100px;border-radius:6px;position:relative}.ph3 .add{border:1.5px dashed var(--border);background:none}
.x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:14px}
.ban{display:flex;gap:8px;border:1.5px solid var(--error);border-left-width:4px;border-radius:6px;background:var(--sunken);padding:12px;font-size:14px;line-height:20px}
.ctr{display:flex;align-items:center;justify-content:center}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;background:var(--surface);border-radius:12px;padding:24px}
.pop{position:absolute;width:360px;background:var(--surface);border-radius:12px;padding:16px}
.sec{font:600 14px Inter;margin:16px 0 8px}
</style>
</head>
<body>
<h1>GoPicos - Picos</h1>
<p class="n">Protótipo estático (substitui o Figma nesta entrega por limite do plano gratuito). Tokens do DS v2.0. Mapas e fotos são ilustrações. Fonte de verdade: <code>docs/design/specs/picos.md</code>.</p>
<div id="app"></div>
<script>
const A=document.getElementById('app');
const poly=(pts,sel)=>`<svg class="pl" viewBox="0 0 393 852"><polygon points="${pts}" fill="var(--primary)" fill-opacity="${sel?.38:.22}" stroke="${sel?'var(--ptext)':'var(--primary)'}" stroke-width="${sel?3:2}"/></svg>`;
const polyW=(pts,sel)=>`<svg class="pl" viewBox="0 0 1280 800"><polygon points="${pts}" fill="var(--primary)" fill-opacity="${sel?.38:.22}" stroke="${sel?'var(--ptext)':'var(--primary)'}" stroke-width="${sel?3:2}"/></svg>`;
const map=(extra='')=>`<div class="map"><i class="pk" style="left:50%;top:62%;width:50%;height:22%"></i><i style="left:0;top:30%;width:130%;height:14px;transform:rotate(8deg)"></i><i style="left:0;top:62%;width:130%;height:10px;transform:rotate(-6deg)"></i><i style="left:30%;top:-2%;width:12px;height:110%;transform:rotate(-4deg)"></i><i style="left:72%;top:0;width:9px;height:110%;transform:rotate(6deg)"></i>${extra}</div>`;
const stars=(n,lab,sz=16)=>`<span style="font-size:${sz}px;letter-spacing:1px">${[1,2,3,4,5].map(i=>`<span class="${i<=Math.round(n)?'st':'stg'}">★</span>`).join('')}</span>${lab?`<b style="font-size:${sz-2}px;margin-left:6px">${lab}</b>`:''}`;
const prev=(st,w)=>`<div class="card sh abs col g8" style="${st};width:${w}px"><div class="r gap" style="align-items:flex-start"><div class="photo" style="width:72px;height:72px;border-radius:6px;flex:none">Foto</div><div class="col" style="gap:4px"><b style="font-size:18px;line-height:24px">Pista da Vila Madalena</b><div class="r g8"><span class="chip on s">Street</span>${stars(5,'4,6 (23)',14)}</div><span class="mu">A 1,2 km de você</span></div></div><div class="btn">Ver detalhes</div></div>`;
const search=(st,w,txt='Buscar cidade ou endereço',foc)=>`<div class="in sh abs" style="${st};width:${w}px;gap:8px;${foc?'border:2px solid var(--info)':''}"><svg width="16" height="16"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--muted)" stroke-width="2"/><path d="M11 11l4 4" stroke="var(--muted)" stroke-width="2"/></svg><span class="${foc?'':'ph'}">${txt}</span></div>`;
const chips=(st,list)=>`<div class="abs r g8" style="${st}">${list.map(([t,o])=>`<span class="chip ${o?'on':''}">${t}</span>`).join('')}</div>`;
const tab=()=>`<div class="tab"><div class="a"><b></b>Mapa</div><div><b></b>Perfil</div></div>`;
const fr=(cls,theme,inner,cap)=>`<div><div class="fr ${theme} ${cls}">${inner}</div><div class="cap">${cap}</div></div>`;
const sec=(t,n)=>`<h2>${t}</h2>${n?`<p class="n">${n}</p>`:''}`;
const home=(th)=>fr('m',th,map(poly('120,380 210,350 250,420 170,460',1)+poly('40,230 100,215 120,270 60,285')+poly('250,560 320,540 330,600 270,620'))+`<span class="pin on" style="left:164px;top:392px">★ 4,6</span><span class="pin" style="left:60px;top:236px">★ 4,1</span><span class="pin" style="left:276px;top:572px">★ 3,8</span>`+search('left:16px;top:60px',361)+chips('left:16px;top:120px',[['Filtros'],['Street',1],['Gratuito']])+`<div class="fab sh" style="left:321px;top:468px">+</div>`+prev('left:16px;top:540px',361)+tab(),'Home mapa, pico selecionado');
const homeW=()=>fr('w','light',`<div class="map" style="top:64px">${polyW('500,330 640,300 700,400 570,460',1)+polyW('200,230 300,210 320,300 230,320')+polyW('900,500 1020,480 1040,580 930,600')}</div><span class="pin on" style="left:540px;top:380px">★ 4,6</span><span class="pin" style="left:240px;top:265px">★ 4,1</span><span class="pin" style="left:950px;top:550px">★ 3,8</span><div class="hdr"><span class="logo">GoPicos</span><div class="r gap"><div class="btn" style="width:130px;height:40px">Novo pico</div><div class="ctr" style="width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--ptext);font:600 14px Inter">AL</div></div></div>`+search('left:32px;top:80px',420)+chips('left:32px;top:140px',[['Filtros'],['Street',1],['Gratuito']])+prev('left:600px;top:420px',340),'Web / Home mapa (>= 1024)');
const info=`<div style="background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:4px 16px"><div class="row2"><span class="mu">Entrada</span><b>Gratuita</b></div><div class="row2"><span class="mu">Horário</span><b>Aberto 24 horas</b></div><div class="row2"><span class="mu">Cobertura</span><b>Coberto</b></div><div class="row2"><span class="mu">Equipamento</span><b>Exige proteção</b></div></div>`;
const mini=(w,h)=>`<div class="fr" style="width:${w}px;height:${h}px;border-radius:12px">${map(`<svg class="pl" viewBox="0 0 ${w} ${h}"><polygon points="${w*.3},${h*.25} ${w*.6},${h*.15} ${w*.7},${h*.6} ${w*.4},${h*.8}" fill="var(--primary)" fill-opacity=".38" stroke="var(--ptext)" stroke-width="3"/></svg>`)}</div>`;
const detail=(th)=>fr('m tall',th,`<div class="photo abs" style="left:0;top:0;width:393px;height:260px">Galeria de fotos (deslize)</div><div class="back sh" style="left:16px;top:58px">←</div><span class="abs chip s" style="left:310px;top:226px;height:24px;border-radius:99px;border:0">1 / 4</span><div class="abs col g16" style="left:20px;top:280px;width:353px"><div><div class="title">Pista da Vila Madalena</div><span class="spray"></span></div><div class="r g8"><span class="chip on">Street</span><span class="chip">Gratuito</span><span class="chip">Coberto</span></div><div class="r g8">${stars(5,'4,6',20)}<span class="mu">23 avaliações</span></div><div>Corrimãos, escadaria de 6 degraus e piso liso. Melhor de manhã, quando está vazio.</div>${info}${mini(353,160)}<span class="mu">Criado por Rafa Lima</span><div class="r gap"><div class="btn g">Editar</div><div class="btn d">Excluir</div></div></div><div class="abs" style="left:0;top:1088px;width:393px;height:92px;background:var(--surface);padding:12px 20px"><div class="btn">Avaliar este pico</div></div>`,'Detalhe (autor). Editar e Excluir só aparecem para o autor');
const detailW=()=>fr('w','light',`<div class="hdr"><span class="logo">GoPicos</span><div class="btn" style="width:130px;height:40px">Novo pico</div></div><div class="abs r" style="left:80px;top:96px;gap:32px;align-items:flex-start"><div class="col gap" style="width:680px"><div class="photo" style="height:380px;border-radius:12px">Galeria de fotos</div><div class="r g8">${[1,2,3,4].map(i=>`<div class="photo" style="width:88px;height:64px;border-radius:6px">Foto ${i}</div>`).join('')}</div><b style="font-size:18px">Descrição</b><div>Corrimãos, escadaria de 6 degraus e piso liso. Melhor de manhã, quando está vazio.</div></div><div class="col g16" style="width:408px"><b style="color:var(--ptext);font-size:14px">← Voltar ao mapa</b><div><div class="title" style="font-size:30px">Pista da Vila Madalena</div><span class="spray"></span></div><div class="r g8"><span class="chip on">Street</span><span class="chip">Gratuito</span><span class="chip">Coberto</span></div><div class="r g8">${stars(5,'4,6',20)}<span class="mu">23 avaliações</span></div>${info}${mini(408,170)}<span class="mu">Criado por Rafa Lima</span><div class="btn">Avaliar este pico</div><div class="r gap"><div class="btn g">Editar</div><div class="btn d">Excluir</div></div></div></div>`,'Web / Detalhe (/spot/:id)');
const draw=(th)=>fr('m',th,map(poly('110,330 230,300 270,410 150,470',0).replace('fill-opacity=".22"','fill-opacity=".3"')+`<svg class="pl" viewBox="0 0 393 852">${['110,330','230,300','270,410','150,470'].map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="9" fill="var(--surface)" stroke="var(--ptext)" stroke-width="3"/>`).join('')}</svg>`)+`<div class="abs" style="left:184px;top:238px;width:24px;height:24px;font:300 28px/24px Inter;text-align:center;color:var(--text)">+</div><div class="back sh" style="left:16px;top:58px">←</div><div class="card sh abs" style="left:76px;top:58px;width:301px;height:44px;padding:0 14px;display:flex;align-items:center;font:600 14px Inter">Passo 1 de 2 - Marque o local</div>`+`<div class="sheet col g8" style="padding-bottom:28px"><div class="mu">Rua Harmonia, Vila Madalena</div><div>Toque no mapa para marcar os cantos do pico. Arraste um ponto para ajustar.</div><b style="font-size:14px">4 pontos</b><div class="btn g">+ Adicionar ponto no centro do mapa</div><div class="r g8"><div class="btn g" style="flex:1">Desfazer</div><div class="btn g" style="flex:1">Limpar</div></div><div class="btn g">Usar minha posição</div><div class="btn">Continuar</div></div>`,'Criar pico, passo 1 (4 pontos = Continuar habilitado)');
const form=(th,withErr)=>fr('m tall',th,`<div class="back sh" style="left:16px;top:58px;background:none;box-shadow:none">←</div><div class="abs col g16" style="left:20px;top:112px;width:353px"><div class="mu" style="font-weight:500">Passo 2 de 2</div><div class="r g8"><i style="flex:1;height:4px;border-radius:2px;background:var(--primary)"></i><i style="flex:1;height:4px;border-radius:2px;background:var(--primary)"></i></div><div><div class="title">Detalhes do pico</div><span class="spray" style="width:150px"></span></div><div class="r gap" style="background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:8px">${mini(96,56)}<div class="col" style="flex:1"><b style="font-size:14px">Local marcado</b><span class="mu">4 pontos</span></div><b style="color:var(--ptext);font-size:14px;padding-right:8px">Alterar</b></div><div><label>Fotos (1 a 5, até 5 MB cada)</label><div class="ph3"><div class="photo">Capa<span class="x">✕</span></div><div class="photo">Foto 2<span class="x">✕</span></div><div class="photo add">+ Adicionar</div></div><div class="help">2 de 5 fotos</div></div><div><label>Nome</label><div class="in ${withErr?'e':''} ${withErr?'':'ph'}">${withErr?'':'Ex.: Praça da Sé'}</div>${withErr?'<div class="err">Informe o nome do pico.</div>':''}</div><div><label>Descrição</label><div class="in ta ph">Conte o que tem no pico e a melhor hora</div></div><div><label>Modalidade</label><div class="r g8" style="flex-wrap:wrap"><span class="chip on">Street</span><span class="chip">Park</span><span class="chip">Bowl/Pool</span><span class="chip">Vertical</span><span class="chip">Downhill</span><span class="chip">Mista</span></div></div><div><label>Entrada</label><div class="seg"><div>Gratuito</div><div class="on">Pago</div></div><div style="margin-top:8px"><div class="in ph">Valor, ex.: R$ 20</div></div></div><div class="r" style="justify-content:space-between"><span>Aberto 24 horas</span><div class="sw on"></div></div><div class="r gap"><div class="cb on">✓</div>Coberto</div><div class="r gap"><div class="cb"></div>Exige equipamento de proteção</div><div class="btn">Criar pico</div></div>`,withErr?'Criar pico, passo 2, erro de campo':'Criar pico, passo 2 (rolável)');
const filt=(th)=>fr('m',th,map(poly('120,380 210,350 250,420 170,460',0))+search('left:16px;top:60px',361)+`<div class="dim"></div><div class="sheet col" style="padding-bottom:28px"><div class="r" style="justify-content:space-between"><b style="font-size:20px">Filtros</b><b style="color:var(--ptext);font-size:14px">Limpar filtros</b></div><div class="sec">Modalidade</div><div class="r g8" style="flex-wrap:wrap"><span class="chip on">Street</span><span class="chip">Park</span><span class="chip">Bowl/Pool</span><span class="chip on">Vertical</span><span class="chip">Downhill</span><span class="chip">Mista</span></div><div class="sec">Entrada</div><div class="seg"><div class="on">Todos</div><div>Gratuito</div><div>Pago</div></div><div class="r" style="justify-content:space-between;margin-top:16px"><span>Somente cobertos</span><div class="sw"></div></div><div class="sec">Nota mínima</div><div class="seg"><div class="on">Qualquer</div><div>3+</div><div>4+</div><div>5</div></div><div class="btn" style="margin-top:16px">Aplicar filtros</div></div>`,'Filtros (sheet)');
const filtW=()=>fr('w','light',`<div class="map" style="top:64px"></div><div class="hdr"><span class="logo">GoPicos</span></div>`+search('left:32px;top:80px',420)+chips('left:32px;top:140px',[['Filtros (2)',1],['Street',1],['Vertical',1]])+`<div class="pop sh" style="left:32px;top:190px"><div class="r" style="justify-content:space-between"><b style="font-size:18px">Filtros</b><b style="color:var(--ptext);font-size:14px">Limpar filtros</b></div><div class="sec">Modalidade</div><div class="r g8" style="flex-wrap:wrap"><span class="chip on">Street</span><span class="chip">Park</span><span class="chip">Bowl/Pool</span><span class="chip on">Vertical</span><span class="chip">Downhill</span><span class="chip">Mista</span></div><div class="sec">Entrada</div><div class="seg"><div class="on">Todos</div><div>Gratuito</div><div>Pago</div></div><div class="sec">Nota mínima</div><div class="seg"><div class="on">Qualquer</div><div>3+</div><div>4+</div><div>5</div></div><div class="btn" style="margin-top:16px">Aplicar filtros</div></div>`,'Web / Filtros (popover)');
const sug=(th,empty)=>fr('m',th,map()+`<div class="abs" style="inset:0;background:var(--bg)"></div>`+search('left:16px;top:60px',361,'Vila Mad',1)+`<div class="card abs col" style="left:16px;top:120px;width:361px;padding:4px 0">${empty?`<div style="padding:20px 16px"><b>Nenhum lugar encontrado</b><div class="mu">Tente outro nome ou endereço.</div></div>`:['Vila Madalena|São Paulo, SP','Vila Madalena|Belo Horizonte, MG','Rua Vila Madalena|Campinas, SP'].map(s=>`<div class="r gap" style="min-height:56px;padding:0 16px;border-bottom:1px solid var(--divider)"><span style="width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid var(--primary);flex:none"></span><div><b>${s.split('|')[0]}</b><div class="mu">${s.split('|')[1]}</div></div></div>`).join('')}</div>`,empty?'Busca, sem resultados':'Busca com sugestões');
const del=(th)=>fr('m',th,`<div class="photo abs" style="left:0;top:0;width:393px;height:260px">Detalhe</div><div class="dim"></div><div class="sheet col g8"><b style="font-size:20px">Excluir este pico?</b><div class="mu" style="font-size:16px;line-height:24px">Esta ação não pode ser desfeita. O pico, as fotos e as avaliações dele serão removidos.</div><div class="btn x" style="margin-top:8px">Excluir pico</div><div class="btn g">Cancelar</div></div>`,'Excluir (sheet; foco inicial em Cancelar)');
const delW=()=>fr('w','light',`<div class="hdr"><span class="logo">GoPicos</span></div><div class="dim"></div><div class="dlg col g8"><b style="font-size:20px">Excluir este pico?</b><div class="mu" style="font-size:16px;line-height:24px">Esta ação não pode ser desfeita. O pico, as fotos e as avaliações dele serão removidos.</div><div class="r gap" style="justify-content:flex-end;margin-top:12px"><div class="btn g" style="width:120px">Cancelar</div><div class="btn x" style="width:150px">Excluir pico</div></div></div>`,'Web / Excluir (dialog)');
const empty=()=>fr('m','light',map()+search('left:16px;top:60px',361)+chips('left:16px;top:120px',[['Filtros']])+`<div class="sheet col g8" style="align-items:center;text-align:center;padding-bottom:110px"><b style="font-size:20px">Nenhum pico por aqui ainda</b><div class="mu" style="font-size:16px;line-height:24px">Seja o primeiro a cadastrar um pico nesta região.</div><div class="btn" style="margin-top:8px">Cadastrar o primeiro pico</div></div>`+tab(),'Home vazio');
const errH=()=>fr('m','light',map()+search('left:16px;top:60px',361)+`<div class="ban abs" style="left:16px;top:120px;width:361px"><b style="color:var(--error)">!</b><div style="flex:1">Não foi possível carregar os picos. Verifique sua conexão.</div><b style="color:var(--ptext)">Tentar novamente</b></div>`+tab(),'Home com erro de carregamento');
const loadD=()=>fr('m tall','light',`<div class="sk abs" style="left:0;top:0;width:393px;height:260px;border-radius:0"></div><div class="abs col gap" style="left:20px;top:280px;width:353px"><div class="sk" style="height:32px;width:70%"></div><div class="sk" style="height:28px;width:50%"></div><div class="sk" style="height:20px;width:40%"></div><div class="sk" style="height:72px"></div><div class="sk" style="height:180px"></div></div>`,'Detalhe carregando (skeleton)');
const nf=()=>fr('m','light',`<div class="back sh" style="left:16px;top:58px">←</div><div class="abs col g8" style="left:33px;right:33px;top:300px;align-items:center;text-align:center"><div class="title">Pico não encontrado</div><div class="mu" style="font-size:16px;line-height:24px">Ele pode ter sido excluído ou o link está errado.</div><div class="btn" style="margin-top:12px">Voltar ao mapa</div></div>`,'Detalhe não encontrado');
const revItem=(n,when,r,txt,me)=>`<div class="col" style="gap:6px;padding:12px 0;border-bottom:1px solid var(--divider)"><div class="r gap"><div class="photo" style="width:32px;height:32px;border-radius:50%;flex:none">${n[0]}</div><div class="col" style="flex:1"><b style="font-size:14px">${n}${me?' <span class="chip s" style="height:20px;padding:0 6px;font-size:12px">Sua avaliação</span>':''}</b><span class="mu" style="font-size:12px">${when}</span></div>${stars(r,'',14)}</div>${txt?`<div style="font-size:16px;line-height:24px">${txt}</div>`:''}${me?'<div class="r g16"><b style="font-size:14px;color:var(--ptext)">Editar</b><b style="font-size:14px;color:var(--error)">Excluir</b></div>':''}</div>`;
const revs=(th)=>fr('m tall',th,`<div class="abs col" style="left:20px;top:24px;width:353px"><b style="font-size:20px">Avaliações</b><div class="r gap" style="margin:8px 0 8px"><b style="font-size:36px;line-height:40px">4,6</b><div class="col">${stars(5,'',20)}<span class="mu">23 avaliações</span></div></div>${revItem('Você','há 1 hora',4,'Piso liso e bom de noite.',1)}${revItem('Rafa Lima','há 2 dias',5,'Melhor pico da região, bowl enorme.')}${revItem('Usuário Desativado','há 1 semana',3,'')}${revItem('Duda','há 3 semanas',4,'Cuidado com o chão molhado quando chove.')}<div class="btn g" style="margin-top:12px">Carregar mais</div></div><div class="tab" style="height:92px;padding-top:12px;display:block"><div class="btn" style="margin:0 20px;width:auto">Ver minha avaliação</div></div>`,'Seção de avaliações (minha avaliação no topo)');
const rform=(th,sel)=>fr('m',th,`<div class="photo abs" style="left:0;top:0;width:393px;height:260px">Detalhe</div><div class="dim"></div><div class="sheet col g8"><b style="font-size:20px">Avaliar este pico</b><div class="r g8" style="justify-content:center;font-size:40px;letter-spacing:4px">${[1,2,3,4,5].map(i=>`<span class="${i<=sel?'st':'stg'}">★</span>`).join('')}</div><div class="mu" style="text-align:center">${sel?['','Ruim','Regular','Bom','Muito bom','Excelente'][sel]:'Escolha de 1 a 5 estrelas'}</div><label>Comentário (opcional)</label><div class="in ta"><span class="ph">${sel?'Piso liso e bom de noite.':'Conte como é andar neste pico'}</span></div><div class="mu" style="text-align:right;font-size:12px">${sel?'25':'0'}/500</div><div class="btn ${sel?'':'dis'}">Enviar avaliação</div><div class="btn g">Cancelar</div></div>`,sel?'Formulário preenchido':'Formulário sem nota (Enviar desabilitado)');
const revEmpty=()=>fr('m','light',`<div class="abs col g8" style="left:33px;right:33px;top:280px;align-items:center;text-align:center"><div class="st" style="font-size:48px">★</div><div class="title">Seja o primeiro a avaliar</div><div class="mu" style="font-size:16px">Conte como é andar neste pico.</div></div><div class="tab" style="height:92px;padding-top:12px;display:block"><div class="btn" style="margin:0 20px;width:auto">Avaliar este pico</div></div>`,'Avaliações: estado vazio');
const spotCard=(n,mod,r,c,sk)=>sk?`<div class="card r gap" style="min-height:96px;border:1px solid var(--divider)"><div class="sk" style="width:72px;height:72px;border-radius:6px;flex:none"></div><div class="col" style="flex:1;gap:8px"><div class="sk" style="height:18px;width:70%"></div><div class="sk" style="height:24px;width:40%"></div><div class="sk" style="height:14px;width:50%"></div></div></div>`:`<div class="card r gap" style="min-height:96px;border:1px solid var(--divider)"><div class="photo" style="width:72px;height:72px;border-radius:6px;flex:none">Foto</div><div class="col" style="flex:1;gap:6px"><b style="font-size:18px;line-height:24px">${n}</b><span><span class="chip on s">${mod}</span></span><div>${r?stars(r,r.toString().replace('.',',')+' ('+c+')',16):'<span class="mu">Sem avaliações</span>'}</div></div></div>`;
const cards=(th)=>fr('m',th,`<div class="abs col g8" style="left:16px;right:16px;top:60px"><b style="font-size:20px">Meus picos</b>${spotCard('Pista da Vila','Street',4.6,23)}${spotCard('Bowl do Parque','Bowl/Pool',0,0)}${spotCard('',' ',0,0,1)}</div>`,'SpotCard compacto (lista): padrão, sem avaliações e skeleton');
const R=(t,n,...x)=>`${sec(t,n)}<div class="row">${x.join('')}</div>`;
A.innerHTML=R('1. Home com mapa','Pin com a nota, polígono do pico, resumo ao tocar, FAB para criar.',home('light'),home('dark'),homeW())
+R('2. Detalhe do pico','Visão do autor. Para quem não é autor, somem Editar e Excluir.',detail('light'),detail('dark'),detailW())
+R('3. Criar pico','Passo 1 marca o polígono; passo 2 preenche detalhes e fotos.',draw('light'),form('light',0),form('dark',1))
+R('4. Filtros e busca','Filtros ativos viram chips; busca de lugar com sugestões.',filt('light'),filt('dark'),filtW(),sug('light'),sug('light',1))
+R('5. Excluir pico','Confirmação destrutiva.',del('light'),del('dark'),delW())
+R('6. Avaliações','Lista com minha avaliação, formulário de nota e comentário, estado vazio.',revs('light'),revs('dark'),rform('light',0),rform('dark',4),revEmpty())
+R('7. SpotCard compacto','Variante de lista, usada no resumo do mapa (com distância e botão) e em Meus picos (perfil). Sem endereço.',cards('light'),cards('dark'))
+R('8. Estados','Vazio, erro, carregando e não encontrado.',empty(),errH(),loadD(),nf());
</script>
