<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoPicos - Sheets, Dialogs e zonas - catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<!-- Protótipo HTML estático e autocontido (só Google Fonts de fora). Não é código de produção.
     Feito em HTML porque o Figma MCP (plano Starter) bateu o limite de chamadas; fallback autorizado pelo dono. -->
<style>
:root{
  --bg:#F0F3F5;--surface:#FFFFFF;--sunken:#E3E8EC;--text:#18181B;--muted:#565757;--subtle:#5C646A;
  --border:#7D858C;--divider:#D5DBE0;--primary:#F97316;--primary-hover:#EA580C;--on-primary:#18181B;
  --primary-soft:#FFEDD5;--primary-text:#A84300;--star:#C77700;--success:#146C35;--error:#B3201F;--on-error:#FFFFFF;
  --error-soft:#FDECEC;--warning:#8F5200;--info:#1D4ED8;--focus:#1D4ED8;--yellow:#FACC15;--ink:#18181B;
  --outline:#18181B;--stk:#18181B;--dim:rgba(0,0,0,.4);
  --shadow2:0 4px 12px rgba(24,24,27,.14);--shadow3:0 12px 32px rgba(24,24,27,.22);
  --page:#D9DFE4;--page-text:#18181B;--kb:#D1D4DA;--key:#FFFFFF;--key2:#ADB3BC;
  --map-land:#F2EFE9;--map-bld:#E3DED4;--map-road:#FFFFFF;--map-case:#D6CFC3;--map-park:#CDE6C2;--map-water:#A9D3EE;--map-label:#4F555C;
}
[data-theme="dark"]{
  --bg:#0F1113;--surface:#181B1F;--sunken:#0A0B0D;--text:#F5F6F7;--muted:#B2B8BE;--subtle:#9AA1A8;
  --border:#838B93;--divider:#2C3138;--primary:#FB923C;--primary-hover:#FDBA74;--on-primary:#1A0B02;
  --primary-soft:#3A2008;--primary-text:#FDBA74;--star:#FBBF24;--success:#4ADE80;--error:#FF8A80;--on-error:#0F1113;
  --error-soft:#3A1414;--warning:#FBBF24;--info:#7FA8FF;--focus:#7FA8FF;
  --outline:#F5F6F7;--stk:#FACC15;--dim:rgba(0,0,0,.55);
  --shadow2:0 0 0 1px rgba(255,255,255,.08);--shadow3:0 0 0 1px rgba(255,255,255,.10),0 12px 32px rgba(0,0,0,.5);
  --page:#050607;--page-text:#F5F6F7;--kb:#2B2B2E;--key:#6B6B70;--key2:#47474B;
  --map-land:#1A2131;--map-bld:#232C3F;--map-road:#2E3950;--map-case:#141A26;--map-park:#1B332E;--map-water:#0B1727;--map-label:#AEB8CB;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--page);color:var(--page-text);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.pm{font-family:'Permanent Marker','Inter',cursive;font-weight:400;letter-spacing:.2px}

/* barra do protótipo */
.proto-bar{position:sticky;top:0;z-index:1000;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;padding:12px 24px;background:var(--surface);color:var(--text);border-bottom:1px solid var(--divider);box-shadow:var(--shadow2)}
.proto-bar h1{margin:0 12px 0 0;font-size:20px;line-height:24px;display:flex;align-items:center;gap:10px}
.proto-bar h1 small{font:500 12px Inter;color:var(--muted);display:block}
.pb-group{display:flex;flex-direction:column;gap:4px}
.pb-group>span{font:600 11px Inter;color:var(--muted)}
.pb-seg{display:flex;border:1.5px solid var(--border);border-radius:6px;overflow:hidden}
.pb-seg button{border:0;background:var(--surface);color:var(--text);font:600 13px Inter;padding:8px 12px;min-height:36px}
.pb-seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.proto-bar select{min-height:36px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:500 13px Inter;padding:0 8px;max-width:340px}
.pb-check{display:flex;align-items:center;gap:8px;min-height:36px;font:600 13px Inter;border:1.5px solid var(--border);border-radius:6px;padding:0 12px;background:var(--surface);color:var(--text)}
.pb-check input{width:18px;height:18px;accent-color:var(--primary)}
.pb-nav{display:flex;gap:6px}
.pb-nav button{min-height:36px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:600 13px Inter;padding:0 10px}
.proto-bar :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

main{padding:20px 24px 64px}
.note{max-width:1240px;margin:0 auto 18px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.note-card{flex:1 1 560px;background:var(--surface);color:var(--text);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow2);font-size:14px;line-height:20px}
.note-card b{font-weight:700}
.note-card ul{margin:6px 0 0;padding-left:18px}
.legend{flex:0 1 520px;display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);color:var(--text);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow2);font:600 12px Inter}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:2px dashed}
.legend span{white-space:nowrap;margin-right:10px}
.phones{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start}
.device{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0}
.device figcaption{font:600 13px Inter;color:var(--page-text);text-align:center}
.device figcaption small{display:block;font-weight:500;opacity:.75}
.bezel{background:#0B0B0C;box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 0 0 2px #2A2A2D}
.bezel.se{padding:72px 12px;border-radius:50px;position:relative}
.bezel.se::before{content:"";position:absolute;top:30px;left:50%;width:56px;height:6px;margin-left:-28px;border-radius:3px;background:#222}
.bezel.se::after{content:"";position:absolute;bottom:13px;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;border:2px solid #333}
.bezel.and{padding:10px;border-radius:30px}
.bezel.notch{padding:12px;border-radius:60px}
.screen{position:relative;overflow:hidden;background:var(--bg);isolation:isolate;color:var(--text)}
.bezel.and .screen{border-radius:22px}
.bezel.notch .screen{border-radius:48px}
.a{position:absolute}
h2.sec{max-width:1240px;margin:44px auto 14px;font-size:18px;color:var(--page-text);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2.sec small{font:500 13px Inter;opacity:.75}
.webs{display:flex;flex-direction:column;gap:28px;align-items:center}
.webbox{display:flex;flex-direction:column;gap:8px;align-items:center}
.webbox figcaption{font:600 13px Inter}
.webclip{overflow:hidden;border-radius:12px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.web{position:relative;overflow:hidden;background:var(--bg);transform-origin:top left;color:var(--text)}

/* sistema */
.statusbar{left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;font:600 15px Inter;z-index:90;padding:0 22px;color:var(--text);pointer-events:none}
.island{left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:96}
.punch{left:50%;top:8px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#000;z-index:96;box-shadow:0 0 0 2px #1b1b1b}
.homeind{left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);z-index:95}
.andnav{left:0;right:0;display:flex;justify-content:space-around;align-items:center;color:var(--muted);z-index:95;background:var(--surface)}
.kb{left:0;right:0;background:var(--kb);z-index:70;padding:6px 3px 0}
.kbrow{display:flex;justify-content:center;gap:5px;margin:0 0 10px}
.key{height:40px;flex:1;max-width:34px;border-radius:5px;background:var(--key);box-shadow:0 1px 0 rgba(0,0,0,.3);display:grid;place-items:center;font:400 19px Inter;color:var(--text)}
.key.w{max-width:none;flex:1.5;background:var(--key2);font-size:14px}
.key.sp{max-width:none;flex:5;font-size:14px}
.key.go{max-width:none;flex:2;background:var(--info);color:#fff;font-size:14px;font-weight:600}
.kbpred{display:flex;justify-content:space-around;height:36px;align-items:center;font:500 15px Inter;color:var(--text);margin-bottom:6px}

/* zonas */
.zone{position:absolute;border:2px dashed;border-radius:4px;z-index:200;pointer-events:none!important;font:700 10px/12px Inter;padding:2px 4px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.zone em{font-style:normal;display:inline-block;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.6)}

/* componentes base */
.btn{height:48px;border-radius:6px;font:600 16px Inter;display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;padding:0 16px;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:active{background:var(--primary-hover)}
.btn.primary[disabled]{background:var(--sunken);color:var(--subtle);cursor:not-allowed}
.btn.secondary{background:var(--surface);border:1.5px solid var(--border);color:var(--text)}
.btn.ghost{background:transparent;color:var(--text)}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn.danger-ghost{background:transparent;color:var(--error)}
.btn.loading{opacity:.85}
.btn .spin,.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.xbtn{width:48px;height:48px;border:0;background:none;color:var(--text);display:grid;place-items:center;border-radius:6px;flex:none}
.backbtn{width:48px;height:48px;border:0;background:none;color:var(--text);display:grid;place-items:center;border-radius:6px;flex:none}
.lnk{color:var(--primary-text);font-weight:600;text-decoration:underline;white-space:nowrap;background:none;border:0;padding:0;font-size:14px;min-height:44px}
.caption{font:500 12px/16px Inter;color:var(--muted)}
.lbl{font:600 14px/20px Inter;color:var(--text);display:block;margin-bottom:6px}
.help{font:500 12px/16px Inter;color:var(--muted);margin-top:4px}
.err{font:600 12px/16px Inter;color:var(--error);margin-top:4px;display:flex;gap:4px;align-items:flex-start}
.input{height:48px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);display:flex;align-items:center;padding:0 14px;font:400 16px Inter;color:var(--text);gap:8px}
.input.ph{color:var(--subtle)}
.input.focus{border:2px solid var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.input.bad{border:2px solid var(--error)}
.input.ta{height:auto;min-height:96px;align-items:flex-start;padding-top:12px;line-height:22px}
.caret{display:inline-block;width:2px;height:20px;background:var(--focus);vertical-align:-4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.field{margin-bottom:16px}
.banner{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--error-soft);border:1.5px solid var(--error);border-radius:6px;font:500 14px/20px Inter;color:var(--text)}
.banner .ico{color:var(--error);flex:none;margin-top:1px}
.banner.info{background:var(--surface);border-color:var(--info)}
.banner.info .ico{color:var(--info)}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow2);border:1px solid var(--divider);border-left:4px solid var(--error);font:500 14px/20px Inter;color:var(--text);z-index:60}
.toast.info{border-left-color:var(--info)}
.toast.success{border-left-color:var(--success)}

/* marca */
.tape-wrap{display:inline-block;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.28))}
.tape{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 14px;background:var(--yellow);color:var(--ink);font:700 13px/16px Inter;transform:rotate(-3deg);
  clip-path:polygon(0 14%,3% 0,6% 10%,9% 0,91% 0,94% 10%,97% 0,100% 16%,98% 50%,100% 84%,96% 100%,92% 90%,88% 100%,12% 100%,8% 90%,4% 100%,0 86%,2% 50%)}
.caution{height:10px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,var(--ink) 10px 20px)}
.halftone{background-image:radial-gradient(circle,var(--primary) 1.3px,transparent 1.7px);background-size:7px 7px;opacity:.38;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at 100% 0,#000 20%,transparent 72%);mask-image:radial-gradient(circle at 100% 0,#000 20%,transparent 72%)}
.stk{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font:600 14px Inter}
.stk.on{background:var(--yellow);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--stk);transform:rotate(-2deg)}
.stk.on:nth-child(even){transform:rotate(1.5deg)}
.mchip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:4px;box-shadow:2px 2px 0 var(--stk);font:600 13px Inter;transform:rotate(-2deg)}
.mchip.alt{background:var(--surface);color:var(--text);border-color:var(--outline);transform:rotate(1.5deg)}
.seg{display:flex;border:2px solid var(--outline);border-radius:6px;background:var(--sunken);padding:2px;gap:2px;height:48px}
.seg button{flex:1;border:0;border-radius:4px;background:transparent;color:var(--text);font:600 14px Inter;display:flex;align-items:center;justify-content:center;gap:4px}
.seg button.on{background:var(--primary);color:var(--on-primary);box-shadow:inset 0 0 0 2px var(--ink)}
.swrow{display:flex;align-items:center;justify-content:space-between;min-height:48px;font:500 16px Inter;color:var(--text)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--sunken);border:2px solid var(--border);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--border);box-sizing:border-box}
.sw.on{background:var(--primary);border-color:var(--ink)}
.sw.on::after{left:22px;border-color:var(--ink);background:#fff}
.cbrow{display:flex;align-items:center;gap:12px;min-height:48px;font:500 16px Inter}
.cb{width:24px;height:24px;border:2px solid var(--border);border-radius:4px;display:grid;place-items:center;flex:none;background:var(--surface)}
.cb.on{background:var(--primary);border-color:var(--ink);color:var(--on-primary)}
.ctl{width:48px;height:48px;border-radius:6px;background:var(--surface);border:2px solid var(--outline);box-shadow:3px 3px 0 var(--stk);display:grid;place-items:center;color:var(--text);position:relative;padding:0}
.ctl[disabled]{color:var(--subtle);box-shadow:none;border-color:var(--border);cursor:not-allowed}
.ctl:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stk)}

/* header de tela (mobile) */
.hdr{left:0;right:0;top:0;background:var(--surface);border-bottom:2px solid var(--outline);z-index:30;overflow:hidden}
.hdr-row{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:4px;padding:0 12px 0 4px}
.hdr .ttl{font-family:'Permanent Marker',cursive;font-size:24px;line-height:28px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sprayw{position:absolute;left:52px;bottom:6px}
.hdr .halftone{position:absolute;right:0;top:0;width:110px;height:100%}

/* sheet */
.veil{left:0;right:0;background:var(--dim);z-index:35}
.sheet{left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow3);overflow:hidden;z-index:40;color:var(--text);display:flex;flex-direction:column}
[data-theme="dark"] .sheet{border-top:1px solid var(--divider)}
.sheet.stk-edge{border-top:2px solid var(--outline)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0;flex:none;border:0;padding:0}
.sheet .caution{flex:none}
.sheet-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative}
.sheet-body>*{flex-shrink:0}
.sheet .halftone{position:absolute;right:0;top:0;width:120px;height:90px}
.st-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.st-title .pmt{font-family:'Permanent Marker',cursive;font-size:26px;line-height:32px}
.st-title h3{margin:0;font:700 20px/28px Inter}
.optrow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);text-align:left;width:100%}
.optrow .oi{width:44px;height:44px;border-radius:6px;background:var(--yellow);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--stk);display:grid;place-items:center;color:var(--ink);flex:none;transform:rotate(-3deg)}
.optrow b{display:block;font:600 16px/22px Inter}
.optrow small{display:block;font:500 12px/16px Inter;color:var(--muted)}
.optrow.danger{color:var(--error)}
.optrow.danger .oi{background:var(--error-soft);border-color:var(--error);color:var(--error);box-shadow:none}

/* dialog web */
.wveil{background:var(--dim);z-index:35}
.dlg{background:var(--surface);border-radius:12px;border:2px solid var(--outline);box-shadow:6px 6px 0 var(--stk);z-index:40;color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.dlg .halftone{position:absolute;right:0;top:0;width:140px;height:100px}
.dlg-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px;position:relative}
.dlg-foot{display:flex;justify-content:flex-end;gap:12px}
.dlg-foot .btn{width:auto}

/* web chrome */
.wheader{left:0;right:0;top:0;height:64px;background:var(--surface);border-bottom:2px solid var(--outline);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:30;color:var(--text)}
.wrail{left:0;top:64px;bottom:0;width:72px;background:var(--surface);border-right:2px solid var(--outline);z-index:30;display:flex;flex-direction:column;align-items:stretch;padding-top:8px;gap:4px}
.witem{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px/14px Inter;color:var(--muted);background:none;border:0;position:relative}
.witem.on{color:var(--text);font-weight:700;background:var(--primary-soft)}
.witem.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;background:var(--primary);border-radius:0 2px 2px 0}
.newstk{width:40px;height:34px;border-radius:4px;background:var(--primary);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--stk);display:grid;place-items:center;color:var(--on-primary);transform:rotate(-3deg);margin-bottom:3px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font:700 15px Inter;color:var(--text);border:2px solid var(--outline);flex:none}
.wpanel{background:var(--surface);border:2px solid var(--outline);border-radius:12px;box-shadow:4px 4px 0 var(--stk);z-index:20;color:var(--text)}

/* tab bar (mobile) */
.tabbar{left:0;right:0;background:var(--surface);border-top:2px solid var(--outline);z-index:30}
.tabs{display:flex;height:64px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px/14px Inter;color:var(--muted);background:none;border:0;padding:0;position:relative}
.tab.on{color:var(--text);font-weight:700}

[data-go]{cursor:pointer}

</style>
</head>
<body>
<header class="proto-bar" id="bar" aria-label="Controles do protótipo"></header>
<main>
  <div class="note"><div class="note-card" id="note" aria-live="polite"></div><div class="legend" id="legend" aria-label="Legenda das zonas reservadas"></div></div>
  <h2 class="sec">Mobile <small>toque nos elementos das telas para navegar entre os estados</small></h2>
  <div class="phones" id="phones"></div>
  <h2 class="sec">Web <small>o mesmo estado no navegador</small></h2>
  <div class="webs" id="webs"></div>
</main>
<script>
/* ===== Base comum dos protótipos (gerada; não é código de produção) ===== */
var GP=(function(){
'use strict';
const DEV={
  se:{id:'se',w:375,h:667,top:20,bot:0,kb:260,label:'iPhone SE 375 x 667',sub:'status 20, sem home indicator'},
  and:{id:'and',w:360,h:640,top:24,bot:48,kb:256,label:'Android 360 x 640',sub:'status 24, navegação de 3 botões (48)'},
  notch:{id:'notch',w:393,h:852,top:59,bot:34,kb:302,label:'iPhone com Dynamic Island 393 x 852',sub:'top 59, home indicator 34'}
};

const S=window.S=Object.assign({theme:'light',state:APP.states[0][1][0][0],zones:false},APP.initial||{});
function allStates(){const a=[];APP.states.forEach(g=>g[1].forEach(s=>a.push(s)));return a;}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));if(p.get('estado'))S.state=p.get('estado');if(p.get('tema'))S.theme=p.get('tema')==='escuro'?'dark':'light';if(p.get('zonas'))S.zones=p.get('zonas')==='1';}
function writeHash(){history.replaceState(null,'','#estado='+S.state+'&tema='+(S.theme==='dark'?'escuro':'claro')+(S.zones?'&zonas=1':''));}
function bar(){let h='<h1><span class="pm" style="font-size:26px">GoPicos</span><span>'+APP.title+'<small>'+APP.subtitle+'</small></span></h1>';
  h+='<div class="pb-group"><span>Tema</span><div class="pb-seg" id="pb-theme"><button data-v="light">Claro</button><button data-v="dark">Escuro</button></div></div>';
  h+='<div class="pb-group"><span>Estado exibido</span><div class="pb-nav"><button id="pb-prev" aria-label="Estado anterior">◀</button><select id="pb-state" aria-label="Estado exibido">';
  APP.states.forEach(g=>{h+='<optgroup label="'+g[0]+'">';g[1].forEach(s=>h+='<option value="'+s[0]+'">'+s[1]+'</option>');h+='</optgroup>';});
  h+='</select><button id="pb-next" aria-label="Próximo estado">▶</button></div></div>';
  h+='<label class="pb-check"><input type="checkbox" id="pb-zones"> Mostrar zonas reservadas</label>';
  document.getElementById('bar').innerHTML=h;
  document.querySelectorAll('#pb-theme button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.v;render();});
  document.getElementById('pb-state').onchange=e=>{S.state=e.target.value;render();};
  document.getElementById('pb-zones').onchange=e=>{S.zones=e.target.checked;render();};
  const step=k=>{const a=allStates().map(s=>s[0]);let i=a.indexOf(S.state)+k;if(i<0)i=a.length-1;if(i>=a.length)i=0;S.state=a[i];render();};
  document.getElementById('pb-prev').onclick=()=>step(-1);document.getElementById('pb-next').onclick=()=>step(1);}
function render(){
  document.documentElement.dataset.theme=S.theme;
  document.querySelectorAll('#pb-theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.theme)));
  document.getElementById('pb-state').value=S.state;document.getElementById('pb-zones').checked=S.zones;
  const n=APP.note(S.state,S);document.getElementById('note').innerHTML=n;
  let lg='';(APP.legend||[]).forEach(z=>lg+='<span><i style="border-color:'+ZC[z[0]]+';background:'+ZC[z[0]]+'22"></i>'+z[0]+' '+z[1]+'</span>');
  document.getElementById('legend').innerHTML=lg;document.getElementById('legend').style.display=S.zones?'flex':'none';
  let ph='';(APP.devices||['se','and','notch']).forEach(id=>{const d=GP.DEV[id];const r=APP.mobile(S.state,d,S);
    let inner=r.html;if(S.zones)(r.zones||[]).forEach(z=>{z.c=z.c||ZC[z.n.split(' ')[0]];inner+=GP.zoneHtml(z);});
    ph+='<figure class="device"><div class="bezel '+id+'"><div class="screen" style="width:'+d.w+'px;height:'+d.h+'px">'+inner+'</div></div><figcaption>'+d.label+'<small>'+d.sub+'</small></figcaption></figure>';});
  document.getElementById('phones').innerHTML=ph;
  let wb='';(APP.webWidths||[1280]).forEach(w=>{const H=w<640?740:(w<1024?900:800);const r=APP.web(S.state,w,H,S);if(!r)return;
    let inner=r.html;if(S.zones)(r.zones||[]).forEach(z=>{z.c=z.c||ZC[z.n.split(' ')[0]];inner+=GP.zoneHtml(z);});
    const maxW=Math.min(1200,document.body.clientWidth-48);const sc=Math.min(1,maxW/w);
    wb+='<figure class="webbox" style="margin:0"><div class="webclip" style="width:'+(w*sc)+'px;height:'+(H*sc)+'px"><div class="web" style="width:'+w+'px;height:'+H+'px;transform:scale('+sc+')">'+inner+'</div></div><figcaption>Web '+w+' x '+H+(sc<1?' (exibido a '+Math.round(sc*100)+'%)':'')+'</figcaption></figure>';});
  document.getElementById('webs').innerHTML=wb||'<p class="caption">Sem frame web neste estado.</p>';
  writeHash();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act]');if(!t||t.closest('.proto-bar'))return;
  if(t.dataset.act&&APP.act){APP.act(t.dataset.act,S);render();return;}
  if(t.dataset.go){S.state=t.dataset.go;render();window.scrollTo({top:0,behavior:'smooth'});}});
window.addEventListener('resize',()=>render());
readHash();bar();render();
})();

</script>
</body>
</html>
